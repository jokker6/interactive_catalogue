<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts Catalog</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1f27;
    --line: #2a313c;
    --text: #e6e9ee;
    --muted: #8b94a3;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 320px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
  aside h1 { font-size: 16px; margin: 0 0 10px; }
  #search { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); }
  #list { overflow-y: auto; padding: 6px 0 16px; flex: 1; }
  .cat { padding: 10px 14px 4px; font-size: 11px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); }
  .item { padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .item .n { display: block; }
  .item .c { display: block; color: var(--muted); font-size: 12px; }
  .item:hover, .item.hover { background: #222934; border-left-color: var(--accent); }
  .item.selected { background: #2a2418; border-left-color: var(--accent); }
  .controls { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .controls .row { display: flex; gap: 6px; align-items: center; }
  .controls button { flex: 1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); cursor: pointer; }
  .controls button.on { border-color: var(--accent); color: var(--accent); }
  .controls label { color: var(--muted); font-size: 12px; }
  .controls input[type=range] { flex: 1; }
  #view { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #tip { position: absolute; pointer-events: none; display: none; z-index: 5;
    background: rgba(10,12,16,.92); border: 1px solid var(--accent); border-radius: 6px;
    padding: 6px 10px; white-space: nowrap; }
  #tip small { display: block; color: var(--muted); }
  #card { position: absolute; right: 14px; top: 14px; width: 300px; max-height: calc(100% - 28px);
    overflow-y: auto; display: none; background: rgba(26,31,39,.96); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; z-index: 6; }
  #card h2 { margin: 0 0 2px; font-size: 16px; }
  #card .code { color: var(--accent); font-size: 13px; }
  #card .cat2 { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #card p { margin: 8px 0; }
  #card table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  #card td { padding: 4px 0; border-top: 1px solid var(--line); vertical-align: top; }
  #card td:first-child { color: var(--muted); width: 40%; padding-right: 8px; }
  #card .close { position: absolute; right: 10px; top: 8px; background: none; border: 0;
    color: var(--muted); font-size: 18px; cursor: pointer; }
  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    color: var(--muted); text-align: center; z-index: 4; }
  #warn { position: absolute; left: 14px; top: 14px; max-width: 460px; display: none; z-index: 7;
    background: #3a1f1f; border: 1px solid #7a2e2e; color: #ffb4b4; border-radius: 8px;
    padding: 10px 12px; font-size: 12px; }
  #warn b { display: block; margin-bottom: 4px; }
  #warn div { margin-top: 3px; word-break: break-word; }
  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--muted); font-size: 12px;
    pointer-events: none; }
  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    #view { order: -1; }
    aside { border-right: 0; border-top: 1px solid var(--line); }
    #card { width: calc(100% - 28px); }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>Parts Catalog</h1>
      <input id="search" type="search" placeholder="Search by name or part code…">
    </header>
    <div id="list"></div>
    <div class="controls">
      <div class="row">
        <button data-mode="ghost" class="on">Ghost</button>
        <button data-mode="solid">Solid</button>
        <button data-mode="hide">Hide body</button>
      </div>
      <div class="row">
        <label for="opacity">Opacity</label>
        <input id="opacity" type="range" min="0.05" max="0.8" step="0.01" value="0.25">
      </div>
      <div class="row"><button id="reset">Reset view</button></div>
    </div>
  </aside>
  <main id="view">
    <div id="status">Loading body…</div>
    <div id="warn"></div>
    <div id="tip"></div>
    <div id="card"></div>
    <div id="hint">Left mouse: rotate · Right mouse: pan · Wheel: zoom · Click a part: details</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const SCAN_URL = 'scan.glb';
const PARTS_URL = 'parts.json';

const view = document.getElementById('view');
const statusEl = document.getElementById('status');
const tipEl = document.getElementById('tip');
const cardEl = document.getElementById('card');
const listEl = document.getElementById('list');

// ---------- Stseen ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12151a);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3f4d, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.8); key.position.set(1, 2, 1.5); scene.add(key);
const fill = new THREE.DirectionalLight(0xaabbff, 0.6); fill.position.set(-1.5, 0.5, -1); scene.add(fill);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
resize();

const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

// ---------- Body ----------
let body = null;
let bodyMode = 'ghost';
const bodyMats = [];
let sceneBox = new THREE.Box3();
let home = { pos: new THREE.Vector3(), target: new THREE.Vector3() };

function applyBodyMode() {
  const op = parseFloat(document.getElementById('opacity').value);
  if (body) body.visible = bodyMode !== 'hide';
  for (const m of bodyMats) {
    if (bodyMode === 'solid') {
      m.transparent = false; m.opacity = 1; m.depthWrite = true;
    } else {
      m.transparent = true; m.opacity = op; m.depthWrite = false;
    }
    m.needsUpdate = true;
  }
  document.querySelectorAll('[data-mode]').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === bodyMode));
}

async function loadBody() {
  const gltf = await loader.loadAsync(SCAN_URL);
  body = gltf.scene;
  body.traverse(o => {
    if (o.isMesh) {
      const m = new THREE.MeshStandardMaterial({
        color: 0x8d9aad, roughness: 0.85, metalness: 0.05, side: THREE.DoubleSide
      });
      o.material = m;
      bodyMats.push(m);
      o.raycast = () => {};           // body never takes the mouse, parts are always clickable
    }
  });
  scene.add(body);
  sceneBox = new THREE.Box3().setFromObject(body);
  const size = sceneBox.getSize(new THREE.Vector3());
  const center = sceneBox.getCenter(new THREE.Vector3());
  const r = size.length();
  camera.near = r / 1000;
  camera.far = r * 20;
  camera.updateProjectionMatrix();
  home.target.copy(center);
  home.pos.copy(center).add(new THREE.Vector3(0.9, 0.6, 1.1).normalize().multiplyScalar(r * 0.9));
  camera.position.copy(home.pos);
  controls.target.copy(home.target);
  controls.update();
  applyBodyMode();
}

// ---------- Parts ----------
const parts = [];        // { def, pivot, meshes }
const partMeshes = [];   // raycasti jaoks
let hovered = null;
let selected = null;

function makePivot(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  const pivot = new THREE.Group();
  pivot.position.copy(c);
  obj.position.sub(c);
  pivot.add(obj);
  scene.add(pivot);
  return pivot;
}

function demoObject(def) {
  // Placeholder shape placed by fractions of the body bounding box (until a real CAD file exists)
  const d = def.demo;
  const size = sceneBox.getSize(new THREE.Vector3());
  const min = sceneBox.min;
  const a = d.anchor, s = d.sizeFrac || [0.1, 0.1, 0.1];
  const dims = new THREE.Vector3(size.x * s[0], size.y * s[1], size.z * s[2]);
  const geo = d.shape === 'sphere'
    ? new THREE.SphereGeometry(Math.min(dims.x, dims.y, dims.z) / 2, 32, 24)
    : new THREE.BoxGeometry(dims.x, dims.y, dims.z);
  const mesh = new THREE.Mesh(geo);
  mesh.position.set(min.x + size.x * a[0], min.y + size.y * a[1], min.z + size.z * a[2]);
  const g = new THREE.Group();
  g.add(mesh);
  return g;
}

// ---------- STEP (OpenCascade WebAssembly, loaded only when needed) ----------
const OCCT_BASE = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/';
let occtPromise = null;
function getOcct() {
  occtPromise ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = OCCT_BASE + 'occt-import-js.js';
    s.onload = () => window.occtimportjs({ locateFile: n => OCCT_BASE + n }).then(resolve, reject);
    s.onerror = () => reject(new Error('Failed to load the STEP reader (occt-import-js)'));
    document.head.appendChild(s);
  });
  return occtPromise;
}

async function loadStep(url, def) {
  const [occt, buf] = await Promise.all([
    getOcct(),
    fetch(url).then(r => { if (!r.ok) throw new Error(url + ' (' + r.status + ')'); return r.arrayBuffer(); })
  ]);
  const res = occt.ReadStepFile(new Uint8Array(buf), null);
  if (!res.success) throw new Error('Could not read STEP file: ' + url);
  const group = new THREE.Group();
  for (const m of res.meshes) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
    if (m.attributes.normal) geo.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
    geo.setIndex(new THREE.BufferAttribute(Uint32Array.from(m.index.array), 1));
    if (!m.attributes.normal) geo.computeVertexNormals();
    const color = m.color ? new THREE.Color(m.color[0], m.color[1], m.color[2]) : new THREE.Color(0xf59e0b);
    group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color, metalness: 0.3, roughness: 0.5, side: THREE.DoubleSide
    })));
  }
  // STEP is usually Z-up, the Blender glTF export (body) is Y-up: rotate the same way.
  // If a part ends up on its side, set "zUp": false in parts.json.
  if (def.zUp !== false) group.rotation.x = -Math.PI / 2;
  return group;
}

const failed = [];

async function loadParts() {
  const res = await fetch(PARTS_URL, { cache: 'no-cache' });
  if (!res.ok) throw new Error('parts.json not found (' + res.status + ')');
  let data;
  try { data = await res.json(); }
  catch (e) { throw new Error('parts.json is not valid JSON (' + e.message + '). Check commas and quotes.'); }
  if (!data || !Array.isArray(data.parts)) throw new Error('parts.json must contain a "parts" list');

  for (const def of data.parts) {
    const label = (def.name || def.id || '(unnamed)') + (def.file ? ' [' + def.file + ']' : '');
    let obj;
    try {
      if (def.file && /\.(step|stp)$/i.test(def.file)) obj = await loadStep(def.file, def);
      else if (def.file) obj = (await loader.loadAsync(def.file)).scene;
      else if (def.demo) obj = demoObject(def);
      else { failed.push(label + ': needs a "file" (or "demo") entry'); continue; }
      if (def.scale) obj.scale.multiplyScalar(def.scale);
      if (def.position) obj.position.add(new THREE.Vector3(...def.position));
    } catch (e) {
      console.warn('Failed to load part:', def.id, e);
      failed.push(label + ': ' + (e && e.message ? e.message : e));
      if (def.demo) obj = demoObject(def); else continue;
    }
    const meshes = [];
    obj.traverse(o => {
      if (!o.isMesh) return;
      const old = o.material;
      let m;
      if (old && old.isMeshStandardMaterial) m = old.clone();
      else m = new THREE.MeshStandardMaterial({ color: def.color ? new THREE.Color(def.color) : 0xf59e0b });
      m.metalness = Math.min(m.metalness ?? 0.3, 0.4);
      m.roughness = m.roughness ?? 0.5;
      o.material = m;
      meshes.push(o);
    });
    if (!meshes.length) { failed.push(label + ': file contains no geometry'); continue; }
    const pivot = makePivot(obj);
    const rec = { def, pivot, meshes };
    meshes.forEach(m => { m.userData.part = rec; partMeshes.push(m); });
    parts.push(rec);
  }
}

function showWarnings() {
  const el = document.getElementById('warn');
  if (!failed.length) return;
  el.innerHTML = '';
  const b = document.createElement('b');
  b.textContent = failed.length + ' part(s) could not be shown:';
  el.append(b);
  failed.forEach(f => { const d = document.createElement('div'); d.textContent = f; el.append(d); });
  el.style.display = 'block';
}

// ---------- Highlight ----------
function refreshHighlight() {
  for (const r of parts) {
    const on = r === hovered || r === selected;
    for (const m of r.meshes) {
      m.material.emissive = m.material.emissive || new THREE.Color();
      m.material.emissive.set(on ? 0x6b4300 : 0x000000);
    }
  }
  listEl.querySelectorAll('.item').forEach(li => {
    li.classList.toggle('hover', hovered && li.dataset.id === hovered.def.id);
    li.classList.toggle('selected', selected && li.dataset.id === selected.def.id);
  });
}

function setHover(rec, evt) {
  if (hovered !== rec) { hovered = rec; refreshHighlight(); }
  if (rec && evt) {
    tipEl.innerHTML = '';
    const b = document.createElement('b'); b.textContent = rec.def.name;
    const s = document.createElement('small'); s.textContent = rec.def.code || '';
    tipEl.append(b, s);
    const r = view.getBoundingClientRect();
    tipEl.style.left = Math.min(evt.clientX - r.left + 14, r.width - 220) + 'px';
    tipEl.style.top = (evt.clientY - r.top + 14) + 'px';
    tipEl.style.display = 'block';
  } else {
    tipEl.style.display = 'none';
  }
  renderer.domElement.style.cursor = rec ? 'pointer' : 'default';
}

// ---------- Info card ----------
function showCard(rec) {
  cardEl.innerHTML = '';
  if (!rec) { cardEl.style.display = 'none'; return; }
  const d = rec.def;
  const close = document.createElement('button');
  close.className = 'close'; close.textContent = '×';
  close.onclick = () => select(null);
  const h = document.createElement('h2'); h.textContent = d.name;
  const code = document.createElement('div'); code.className = 'code'; code.textContent = d.code || '';
  const cat = document.createElement('div'); cat.className = 'cat2'; cat.textContent = d.category || '';
  cardEl.append(close, h, code, cat);
  if (d.description) {
    const p = document.createElement('p'); p.textContent = d.description; cardEl.append(p);
  }
  if (d.info && Object.keys(d.info).length) {
    const t = document.createElement('table');
    for (const [k, v] of Object.entries(d.info)) {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = k;
      const b = document.createElement('td'); b.textContent = v;
      tr.append(a, b); t.append(tr);
    }
    cardEl.append(t);
  }
  cardEl.style.display = 'block';
}

let flyTarget = null;
function select(rec, fly) {
  selected = rec;
  showCard(rec);
  refreshHighlight();
  if (rec && fly) flyTarget = rec.pivot.position.clone();
}

// ---------- Mouse ----------
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let down = null;

function pick(evt) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((evt.clientX - r.left) / r.width) * 2 - 1, -((evt.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(partMeshes, false)[0];
  return hit ? hit.object.userData.part : null;
}

renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) { setHover(null); return; }
  setHover(pick(e), e);
});
renderer.domElement.addEventListener('pointerleave', () => setHover(null));
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  down = null;
  if (moved < 5) select(pick(e));
});

// ---------- Sidebar ----------
function buildList() {
  listEl.innerHTML = '';
  const groups = {};
  for (const r of parts) (groups[r.def.category || 'Other'] ||= []).push(r);
  for (const [cat, items] of Object.entries(groups)) {
    const h = document.createElement('div'); h.className = 'cat'; h.textContent = cat;
    listEl.append(h);
    for (const r of items) {
      const li = document.createElement('div');
      li.className = 'item'; li.dataset.id = r.def.id;
      li.dataset.search = (r.def.name + ' ' + (r.def.code || '') + ' ' + cat).toLowerCase();
      const n = document.createElement('span'); n.className = 'n'; n.textContent = r.def.name;
      const c = document.createElement('span'); c.className = 'c'; c.textContent = r.def.code || '';
      li.append(n, c);
      li.onmouseenter = () => setHover(r);
      li.onmouseleave = () => setHover(null);
      li.onclick = () => select(r, true);
      listEl.append(li);
    }
  }
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  let currentCat = null, catVisible = false;
  const nodes = [...listEl.children];
  nodes.forEach(n => {
    if (n.classList.contains('cat')) { currentCat = n; n.style.display = 'none'; catVisible = false; return; }
    const show = !q || n.dataset.search.includes(q);
    n.style.display = show ? '' : 'none';
    if (show && currentCat) currentCat.style.display = '';
  });
});

document.querySelectorAll('[data-mode]').forEach(b =>
  b.addEventListener('click', () => { bodyMode = b.dataset.mode; applyBodyMode(); }));
document.getElementById('opacity').addEventListener('input', applyBodyMode);
document.getElementById('reset').addEventListener('click', () => {
  camera.position.copy(home.pos); controls.target.copy(home.target); select(null);
});

// ---------- Render loop ----------
function animate() {
  requestAnimationFrame(animate);
  for (const r of parts) {
    const t = r === hovered ? 1.15 : (r === selected ? 1.08 : 1);
    const s = r.pivot.scale.x + (t - r.pivot.scale.x) * 0.18;
    r.pivot.scale.setScalar(s);
  }
  if (flyTarget) {
    const d = flyTarget.clone().sub(controls.target).multiplyScalar(0.1);
    controls.target.add(d);
    camera.position.add(d);
    if (d.length() < 0.0005 * sceneBox.getSize(new THREE.Vector3()).length()) flyTarget = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

// ---------- Start ----------
(async () => {
  let stage = 'body';
  try {
    await loadBody();
    stage = 'parts';
    statusEl.textContent = 'Loading parts…';
    await loadParts();
    buildList();
    showWarnings();
    statusEl.style.display = 'none';
  } catch (e) {
    console.error(e);
    statusEl.textContent = 'Loading failed: ' + e.message +
      (stage === 'body' ? ' (scan.glb must be in the same folder as index.html)' : '');
  }
  animate();
})();
</script>
</body>
</html>
